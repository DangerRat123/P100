<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Collage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>

  <div id="viewport" aria-label="Collage of buildings. Drag to move around, scroll or pinch to zoom, tap a building to read about it. Arrow keys step through the buildings.">
    <div id="back" aria-hidden="true"></div>
    <div id="world"></div>
  </div>

  <div id="stage" aria-hidden="true"></div>

  <aside id="panel" aria-hidden="true" aria-live="polite">
    <div class="p-head">
      <span class="p-num"></span>
      <button id="close" aria-label="Close">close</button>
    </div>
    <div class="panel-inner">
      <h2 class="p-title"></h2>
      <dl class="p-facts"></dl>
      <div class="p-body"></div>
      <div class="p-credit"></div>
    </div>
    <div class="p-nav">
      <button id="pPrev">&larr;&ensp;previous</button>
      <button id="pNext">next&ensp;&rarr;</button>
    </div>
  </aside>

  <div id="hint" aria-hidden="true"></div>

  <script src="data.js?v=7"></script>
  <script src="script.js?v=7"></script>
</body>
</html>
